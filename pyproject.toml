[project]
name = "first-llm-dev"
version = "0.1.0"
description = "Kaggle LLM Science Exam - Fine-tuning & Inference Pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.4.1",
    "pandas>=2.3.2",
    "polars>=1.33.1",
    "pyarrow>=23.0.0",
    "rank-bm25>=0.2.2",
    "requests>=2.32.5",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.2.0",
    "transformers>=4.57.6",
    "peft>=0.15.0",
    "bitsandbytes>=0.45.0",
    "accelerate>=1.3.0",
    "tqdm>=4.66.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
]

