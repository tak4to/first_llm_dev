[project]
name = "first-llm-dev"
version = "0.1.0"
description = "Kaggle LLM Science Exam - Fine-tuning and RAG-based solution"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.4.1",
    "datasets>=4.5.0",
    "openai>=2.17.0",
    "pandas>=2.3.2",
    "polars>=1.33.1",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "pytest>=8.4.2",
]

